<div class="page">
    <a routerLink="/" class="back-link"><i class="fa fa-arrow-left"></i> Mis listas</a>

    <h2 class="list-heading" *ngIf="list$ | async as list">{{ list.title || list.name }}</h2>

    <form class="inline-form" (ngSubmit)="add()">
        <input class="text-input" type="text" name="newTodo" [(ngModel)]="newTodo" placeholder="Nueva tarea" autocomplete="off">
        <button type="submit" class="primary-button" [disabled]="!newTodo.trim()">
            <i class="fa fa-plus"></i> Agregar
        </button>
    </form>

    <ng-container *ngIf="todos$ | async as todos">
        <ul class="cards" *ngIf="todos.length; else empty">
            <li class="card todo" *ngFor="let todo of todos" [class.done]="todo.done">
                <button type="button" class="icon-button check" (click)="toggle(todo)"
                        [attr.aria-label]="todo.done ? 'Marcar como pendiente' : 'Marcar como hecha'">
                    <i class="fa" [ngClass]="todo.done ? 'fa-check-circle' : 'fa-circle-o'"></i>
                </button>
                <span class="todo-title">{{ todo.title }}</span>
                <button type="button" class="icon-button delete" (click)="remove(todo)" aria-label="Eliminar tarea">
                    <i class="fa fa-trash"></i>
                </button>
            </li>
        </ul>
    </ng-container>

    <ng-template #empty>
        <p class="empty">Esta lista no tiene tareas. Escribe una arriba y presiona "Agregar".</p>
    </ng-template>
</div>
