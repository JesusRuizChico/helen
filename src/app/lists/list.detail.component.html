<div class="page">
    <div class="detail-toolbar">
        <a routerLink="/" class="back-link"><i class="fa fa-arrow-left"></i> Mis listas</a>
        <button type="button" class="link-button" (click)="toggleForm()">
            Agregar nuevo pendiente <i class="fa" [ngClass]="showForm ? 'fa-minus' : 'fa-plus'"></i>
        </button>
    </div>

    <h2 class="list-heading" *ngIf="list$ | async as list">{{ list.title || list.name }}</h2>

    <form class="todo-form" *ngIf="showForm" (ngSubmit)="add()">
        <input #titleInput class="text-input" type="text" name="newTodo" [(ngModel)]="newTodo" placeholder="Que vas hacer?" autocomplete="off">
        <textarea class="text-input" name="newDescription" [(ngModel)]="newDescription" rows="2" placeholder="Informacion adicional (opcional)"></textarea>
        <button type="submit" class="primary-button" [disabled]="!newTodo.trim()">
            <i class="fa fa-floppy-o"></i> Guardar
        </button>
    </form>

    <ng-container *ngIf="pending$ | async as todos">
        <ul class="cards" *ngIf="todos.length; else empty">
            <li class="todo-row" *ngFor="let todo of todos">
                <button type="button" class="card todo-card" (click)="complete(todo)" title="Clic para marcar como hecho">
                    <span class="todo-title">{{ todo.title }}</span>
                    <span class="todo-description" *ngIf="todo.description">{{ todo.description }}</span>
                </button>
                <button type="button" class="icon-button bell" (click)="complete(todo)" aria-label="Marcar como hecho" title="Marcar como hecho">
                    <i class="fa fa-bell"></i>
                </button>
            </li>
        </ul>
    </ng-container>

    <ng-template #empty>
        <p class="empty">No tienes pendientes en esta lista.</p>
    </ng-template>
</div>
