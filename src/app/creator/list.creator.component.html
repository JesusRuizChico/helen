<form class="page" (ngSubmit)="save()">
    <input class="text-input" type="text" name="title" [(ngModel)]="title" placeholder="Nombre de la lista" autocomplete="off">

    <button type="submit" class="primary-button" [disabled]="saving || !title.trim()">
        <i class="fa fa-floppy-o"></i> Guardar
    </button>
</form>
